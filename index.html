    <script>
        tailwind.config = {

                        darkText: '#3B2F2F',
                        mutedText: '#6E5D5D'
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],

                    }

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #FFFDF9;
            color: #3B2F2F;
            cursor: default;
        }
        .font-playfair {
            font-family: 'Playfair Display', serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(253, 164, 175, 0.25);
        }
        .glass-nav {
            background: rgba(255, 253, 249, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .cute-gradient {
            background: linear-gradient(135deg, #FFE4E6 0%, #FCE7F0 50%, #FFFDF9 100%);
        }
        .badge-soft {
            background-color: rgba(253, 164, 175, 0.15);
            color: #C97A85;
        }
        /* Sparkle float animation */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(3deg); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        /* Custom Cursor Styles */
        .custom-cursor {
            pointer-events: none;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
            transition: transform 0.1s ease;
        }
        .cursor-dot {
            width: 10px;
            height: 10px;
            background-color: #C97A85;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 10000;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, background-color 0.2s;
        }
        .cursor-ring {
            width: 36px;
            height: 36px;
            border: 2px solid rgba(201, 122, 133, 0.4);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: transform 0.15s ease-out, width 0.2s, height 0.2s, border-color 0.2s;
        }
        /* Sparkle particle trail */
        .cursor-sparkle {
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            font-size: 12px;
            animation: sparkle-fade 0.8s forwards;
        }
        @keyframes sparkle-fade {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0.3) rotate(180deg);
                opacity: 0;
            }
        }
    </style>
</head>
